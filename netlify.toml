[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Canonical domain -------------------------------------------------
# betterchange-consulting.de (apex, no www) is canonical.
[[redirects]]
  from = "https://www.betterchange-consulting.de/*"
  to = "https://betterchange-consulting.de/:splat"
  status = 301
  force = true

# --- Old Wix system page ------------------------------------------------
# /confirmation was Wix's own post-checkout page; the new registration
# flow ends at /training/register/thank-you.
[[redirects]]
  from = "/confirmation"
  to = "/training/register/thank-you"
  status = 301

# --- Superseded session date --------------------------------------------
# The live sitemap listed the Berlin FL3D session as 17-11-2026; the
# current content has it as 24-11-2026. Catching the old date just in
# case it was indexed.
[[redirects]]
  from = "/training/register/fl3d-ber-17-11-2026"
  to = "/training/register/fl3d-ber-24-11-2026"
  status = 301

# --- Insights articles whose live slug contains ? or # ------------------
# `?` and `#` are reserved URL delimiters and can never appear literally
# in a served path (a browser truncates everything after them before the
# request even reaches the server, and even percent-encoded forms proved
# unreliable to serve directly — see commit history). The articles below
# are built with that character simply removed. These redirects catch
# both the fully percent-encoded form (in case that's what search engines
# indexed) and, where it differs, the plain truncated path a literal
# unencoded link resolves to.
#
# Five "agile mishap #N" articles are deliberately NOT covered by a
# truncated-path redirect: a literal `#` is stripped client-side by the
# browser before the request is even sent, so all five would truncate to
# the identical ambiguous path "/insights/agile-mishap-" — there is no
# way to redirect that to the right one of five different articles.
[[redirects]]
  from = "/insights/agile-mishap-%231:-do-it-by-the-book!"
  to = "/insights/agile-mishap-1:-do-it-by-the-book!"
  status = 301

[[redirects]]
